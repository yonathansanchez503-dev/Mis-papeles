name: Crear APK de Mis Papeles

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Preparar proyecto
        run: |
          mkdir -p build-src
          unzip -q MisPapeles-GitHub-APK.zip -d paquete
          unzip -q paquete/MisPapelesAndroid-completo.zip -d build-src

      - name: Compilar APK
        working-directory: build-src/MisPapelesAndroid
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MisPapeles-APK
          path: build-src/MisPapelesAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
